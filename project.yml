name: Sentinel
options:
  bundleIdPrefix: com.sentinel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  Sentinel:
    type: application
    platform: macOS
    sources:
      - path: Sentinel
        excludes:
          - Resources
          - Info.plist
          - Sentinel.entitlements
    resources:
      - path: Sentinel/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sentinel.app
        PRODUCT_NAME: Sentinel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sentinel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sentinel/Sentinel.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - package: GRDB
        product: GRDB
      - sdk: IOKit.framework
      - sdk: ApplicationServices.framework
      - sdk: ServiceManagement.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: CoreServices.framework
    entitlements:
      path: Sentinel/Sentinel.entitlements
